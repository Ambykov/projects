<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STT Client — Web Demo</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 600px; margin: 2em auto; padding: 0 1em; }
  h1 { font-size: 1.5em; margin-bottom: 1em; }
  label { display: block; margin-bottom: 0.5em; }
  input[type="text"] { padding: 0.5em; font-size: 1em; width: 200px; }
  button { font-size: 1em; padding: 0.6em 1.2em; cursor: pointer; margin-right: 0.5em; border: none; border-radius: 4px; }
  button#talk { background: #4CAF50; color: white; }
  button#talk:disabled { background: #ccc; cursor: not-allowed; }
  button#stop { background: #f44336; color: white; }
  button#stop:disabled { background: #ccc; cursor: not-allowed; }
  #status { margin: 1em 0; padding: 0.75em; background: #f5f5f5; border-radius: 4px; }
  #partial { color: #666; font-style: italic; }
  #final { font-weight: bold; font-size: 1.2em; color: #2e7d32; }
  .row { margin: 0.5em 0; }
  label { font-weight: 500; }
</style>
</head>
<body>
<h1>STT Client — Web Demo</h1>

<label>
  Token:
  <input id="token" type="text" value="testtoken" size="20">
</label>

<br><br>

<button id="talk">Говорить</button>
<button id="stop" disabled>Стоп</button>

<div id="status">Готов</div>

<div class="row">Partial: <span id="partial">—</span></div>
<div class="row">Final: <span id="final">—</span></div>
<div class="row">TTFP: <span id="ttfp">—</span></div>

<script type="module">
import { Session, STTError } from '../dist/index.js';

const $ = id => document.getElementById(id);
let session = null;
let t0 = 0;
let ttfpRecorded = false;

async function connect() {
  if (session && session.ws?.readyState === WebSocket.OPEN) return;

  $('status').textContent = 'Подключение...';
  session = new Session({
    baseUrl: `ws://${location.hostname}:8100/ws/stt`,
    token: $('token').value,
    workletPath: './resample-worklet.js',
    onReady: () => {
      $('status').textContent = 'Готов';
    },
    onPartial: (text) => {
      if (!ttfpRecorded) {
        $('ttfp').textContent = `${Math.round(performance.now() - t0)} ms`;
        ttfpRecorded = true;
      }
      $('partial').textContent = text;
    },
    onFinal: (r) => {
      $('final').textContent = r.text || '(пусто)';
      $('partial').textContent = '—';
      $('status').textContent = 'Готов';
      $('talk').disabled = false;
      $('stop').disabled = true;
    },
    onError: (e) => {
      $('status').textContent = `Ошибка: ${e.code} — ${e.isRetryable ? 'retry' : 'fatal'}`;
      $('talk').disabled = false;
      $('stop').disabled = true;
    },
  });
  await session.connect();
}

$('talk').onclick = async () => {
  try {
    await connect();
    $('final').textContent = '—';
    $('partial').textContent = '—';
    $('ttfp').textContent = '—';
    $('status').textContent = 'Слушаю...';
    t0 = performance.now();
    ttfpRecorded = false;
    $('talk').disabled = true;
    $('stop').disabled = false;
    await session.startUtterance();
  } catch (e) {
    $('status').textContent = `Ошибка подключения: ${e.message}`;
    $('talk').disabled = false;
  }
};

$('stop').onclick = async () => {
  if (!session) return;
  $('status').textContent = 'Обработка...';
  $('stop').disabled = true;
  try {
    const result = await session.endUtterance();
    $('final').textContent = result.text || '(пусто)';
    $('partial').textContent = '—';
    $('status').textContent = 'Готов';
    $('talk').disabled = false;
  } catch (e) {
    if (e instanceof STTError) {
      $('status').textContent = `Ошибка: ${e.code} — ${e.message}`;
    } else {
      $('status').textContent = `Ошибка: ${e.message}`;
    }
    $('talk').disabled = false;
  }
};
</script>
</body>
</html>
