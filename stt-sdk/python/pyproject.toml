[project]
name = "stt-client"
version = "0.1.1"
description = "Python SDK for STT Gateway (WebSocket + REST)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "websockets>=13.1,<14",
    "httpx>=0.27,<0.28",
]

[project.optional-dependencies]
mic = ["sounddevice>=0.5,<0.6", "numpy>=1.26,<2"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
